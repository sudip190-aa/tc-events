{% extends 'base.html' %}


{% block title %}

Delete Event — TC Events

{% endblock %}


{% block content %}


<section class="auth-page">


    <div class="auth-card">


        <div class="auth-header">

            <span class="auth-icon">
                ⚠️
            </span>

            <h1>
                Delete Event?
            </h1>

            <p>

                Are you sure you want to delete

                <strong>
                    {{ event.title }}
                </strong>?

            </p>

        </div>


        <form method="POST">

            {% csrf_token %}


            <button
                type="submit"
                class="btn btn-primary auth-button">

                Yes, Delete Event

            </button>


            <a
                href="{% url 'my_events' %}"
                class="btn btn-outline auth-button">

                Cancel

            </a>

        </form>


    </div>

</section>


{% endblock %}
